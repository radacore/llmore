version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: llmore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-llmore}
      POSTGRES_USER: ${DB_USERNAME:-llmore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-llmore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: llmore-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: llmore-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: llmore-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_GATEWAY_URL=http://api.llmora.id
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

  # LLM Proxy (internal upstream — OpenRouter pool + auto-rotation)
  # Tidak diexpose ke host; gateway memanggilnya via internal network.
  llm-proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.llmproxy
    container_name: llmore-llmproxy
    restart: unless-stopped
    env_file: ./llm-proxy-vps/.env
    environment:
      - HOST=0.0.0.0
      - PORT=9898
    volumes:
      - llmproxy_data:/app/data
    expose:
      - "9898"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9898/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Node.js Gateway
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: llmore-gateway
    restart: unless-stopped
    env_file: ./gateway/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPSTREAM_API_URL=http://llm-proxy:9898/v1
    volumes:
      - ./gateway:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      llm-proxy:
        condition: service_started

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: llmore-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - gateway

volumes:
  postgres_data:
  redis_data:
  llmproxy_data:
